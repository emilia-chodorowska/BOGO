<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>Podgląd linku – BOGO Offer</title>
<!--
  Podgląd linku (og:image) w stylu em.naturalnie, kość słoniowa. Zmieniasz tylko teksty w <body>.
  Render 1200×630 (z katalogu tego pliku):
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1200,630 --virtual-time-budget=6000 \
      --screenshot=/tmp/og.png "file://$PWD/og-en.html"
    sips -s format jpeg -s formatOptions 90 /tmp/og.png --out images/bogo-social-preview-2026-10-en.jpg
  Po podmianie obrazka podbij ?v=N w og:image i twitter:image strony (Facebook trzyma stary obrazek po adresie).
  Bez pigułki / podpisu: usuń dany <div>. Strona główna huba ma zamiast pigułki <div class="em">em.naturalnie</div>.
-->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FBFAF4' stroke='%235B6147' stroke-width='8'/%3E%3Crect x='26' y='44' width='48' height='12' rx='6' fill='%23EEF0E6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #FBFAF4; }
  body { line-height: 1.55; -webkit-font-smoothing: antialiased; }
  .og { width: 1200px; height: 630px; display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; gap: 26.4px; padding: 0 96px; color: #474C37; }
  .em { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; letter-spacing: .12em; font-size: 31.2px; color: #5B6147; }
  .pill { display: inline-block; font: 500 19.2px 'Jost', sans-serif; letter-spacing: .18em; text-transform: uppercase;
          padding: 7.2px 19.2px; border-radius: 99px; background: #EEF0E6; color: #5B6147; }
  .t { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 400; text-transform: uppercase; letter-spacing: .06em;
       line-height: 1.1; font-size: 76.8px; }
  .s { font: 300 28.8px 'Jost', sans-serif; color: #686B62; }
  .mac { font-family: Futura, 'Jost', sans-serif; }  /* Jost ma zepsute ō/Ō (kreska obok litery) — w pigułce i podpisie „dōTERRA” pisz d<span class="mac">ō</span>TERRA */
</style>
</head>
<body>
  <div class="og">
    <div class="pill">BOGO</div>
    <div class="t">BOGO Offer</div>
    <div class="s">20–27 October 2026 · buy one product, get the second one free</div>
  </div>
</body>
</html>
